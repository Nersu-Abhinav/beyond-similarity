name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test demo
        run: python -m beyond_similarity.cli demo
      - name: Evaluate synthetic fixture
        run: python -m beyond_similarity.cli evaluate --data data/example_tasks.json --output results.json
